name: Update benchmark data

on:
  schedule:
    - cron: "17 6 * * *"  # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Artificial Analysis data
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/build_data.py
      - name: Sanity-check matching still works
        run: python -m unittest discover tests
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/benchmarks.json; then
            echo "No data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks.json
          git commit -m "data: Artificial Analysis snapshot $(date -u +%Y-%m-%d)"
          git push
